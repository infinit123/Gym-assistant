<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gym Assistant — Futuristic Fitness Tracker</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Assistant">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- CSS Resources -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- ONBOARDING VIEW CONTAINER (First Launch) -->
    <div id="onboarding-container" class="onboarding-container hidden"></div>

    <!-- MAIN APP SHELL CONTAINER (Restored Original) -->
    <div id="main-shell" class="main-shell hidden">
      <!-- Header / Top Bar -->
      <header class="app-header">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">GYM<span class="highlight">ASSISTANT</span></span>
        </div>
        <div class="header-actions">
          <span class="date-badge" id="current-date">MON, 24 OCT</span>
        </div>
      </header>

      <!-- Main Dynamic Content View -->
      <main id="main-content" class="main-content">
        <!-- Views loaded dynamically via App Router -->
      </main>

      <!-- Bottom Navigation Bar (Restored Original Styles) -->
      <nav class="bottom-nav">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="workout">
          <span class="nav-icon">🏋️</span>
          <span class="nav-label">Workout</span>
        </button>
        <button class="nav-item" data-view="goals">
          <span class="nav-icon">🎯</span>
          <span class="nav-label">Goals</span>
        </button>
        <button class="nav-item" data-view="profile">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Profile</span>
        </button>
      </nav>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modal-container" class="modal-container hidden"></div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/storage.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/workoutData.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
